<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilot Briefing EFB</title>
    <meta name="theme-color" content="#080c14" />
    <!-- UI / Korean: Pretendard Variable, unicode-range subset so only the glyphs
         actually used are fetched. Matters on a tablet over cellular. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <!-- Figures: Inter. Every monospace face puts a dot or a slash through its
         zero - that is the coding-font convention - and it reads as noise on a
         panel full of fuel and weight figures. Inter's zero is a clean ring, and
         its tabular-nums still lock the digits to one width so columns align.
         IBM Plex Mono stays for the fixed-column documents (NOTAM telex, ATS FPL,
         raw OFP) where character-grid alignment is the whole point. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
